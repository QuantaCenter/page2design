<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Native transforms and controls</title>
<style>
*{box-sizing:border-box}body{margin:0;padding:24px;background:#edf1f7;font:16px/24px Arial;color:#263953}
.case{width:342px;padding:24px;margin-bottom:24px;background:#fff}.stage{position:relative;width:294px;height:180px;background:#e9eef5}
.box{position:absolute;left:54px;top:34px;width:164px;height:94px;padding:12px;background:#307cad;border:3px solid #185172;border-radius:9px;color:#fff}
.box span{font:700 18px/24px Arial}.rotate{transform:rotate(23deg)}.origin{transform-origin:0 0;transform:translate(20px,12px) skewX(13deg) scale(.9,1.1)}
.nested{transform:rotate(-12deg);opacity:.7}.nested i{position:absolute;left:32px;top:30px;width:96px;height:44px;background:#e48a55;transform:rotate(27deg) scale(.8)}
.clip{position:absolute;left:52px;top:40px;width:180px;height:90px;transform:rotate(16deg);overflow:hidden;border-radius:12px;background:#6b62bf}.clipped{position:absolute;left:135px;top:4px;width:100px;height:80px;background:#29a68b}
.individual{translate:12px 8px;rotate:-18deg;scale:.9 1.1}.mirror{transform:scaleX(-1) rotate(9deg)}
.perspective{perspective:420px;perspective-origin:30% 45%}.projected{transform:rotateY(28deg) rotateX(15deg) translateZ(20px);background:linear-gradient(90deg,#b55e85,#347bad)}
.pseudo::after{content:'Native';position:absolute;left:35px;top:25px;padding:4px;background:#f3c15b;color:#283f59;transform:rotate(-25deg)}
.fields{display:grid;gap:12px}.fields input:not([type=checkbox]):not([type=radio]):not([type=range]):not([type=color]),.fields textarea,.fields select{width:270px;border:1px solid #6f8ba5;border-radius:5px;padding:6px 8px;background:#fff;font:16px/24px Arial;color:#263953}
.fields input:disabled{background:#edf0f3;color:#7b8794}.fields textarea{height:88px;resize:none}.fields input[type=range]{width:270px}.fields progress,.fields meter{width:270px;height:20px}.checks{height:36px;display:flex;gap:18px;align-items:center}.checks input{margin:0;width:16px;height:16px;accent-color:#0075ff}
.fields .transformed-field{transform:rotate(-5deg);transform-origin:left center}
</style></head><body>
<section class="case" id="case-rotate"><div class="stage"><div class="box rotate" id="rotated-box"><span>Rotated text</span></div></div></section>
<section class="case" id="case-origin"><div class="stage"><div class="box origin" id="origin-box">Transform origin</div></div></section>
<section class="case" id="case-nested"><div class="stage"><div class="box nested" id="nested-box"><i id="nested-child"></i></div></div></section>
<section class="case" id="case-clip"><div class="stage"><div class="clip" id="transformed-clip"><div class="clipped" id="clipped-child"></div></div></div></section>
<section class="case" id="case-individual"><div class="stage"><div class="box individual" id="individual-box">Individual CSS</div></div></section>
<section class="case" id="case-mirror"><div class="stage"><div class="box mirror" id="mirrored-box">Mirrored text</div></div></section>
<section class="case" id="case-perspective"><div class="stage perspective"><div class="box projected" id="perspective-box"><span>Perspective</span></div></div></section>
<section class="case" id="case-pseudo-transform"><div class="stage"><div class="box pseudo" id="pseudo-transform"></div></div></section>
<section class="case fields" id="case-text-controls">
 <input id="current-input" value="Old value"><input id="placeholder-input" placeholder="Native placeholder"><input id="disabled-input" disabled value="Disabled value"><input id="readonly-input" readonly value="Read only">
 <input id="password-input" type="password" value="secret123"><textarea id="current-textarea">Original text</textarea>
 <select id="current-select"><option>First</option><option>Selected label</option><option>Last</option></select>
 <input id="date-input" type="date" value="2026-11-17"><input id="transformed-input" class="transformed-field" value="Rotated input">
</section>
<section class="case fields" id="case-choice-controls"><div class="checks"><input id="unchecked" type="checkbox"><input id="checked" type="checkbox" checked><input id="indeterminate" type="checkbox"><input id="radio-unchecked" type="radio" name="choice"><input id="radio-checked" type="radio" name="choice" checked><input type="checkbox" checked disabled></div><select id="list-select" multiple size="3"><option selected>First option</option><option>Second option</option><option selected>Third option</option></select></section>
<section class="case fields" id="case-metric-controls"><input id="range-input" type="range" min="0" max="100" value="65"><progress id="progress-control" max="100" value="40"></progress><meter id="meter-control" min="0" max="100" value="60"></meter><input id="color-input" type="color" value="#37a78a"></section>
<script>
document.getElementById('current-input').value='Current value';document.getElementById('current-select').selectedIndex=1;
document.getElementById('current-textarea').value='Current textarea value wraps on real browser lines and keeps\nexplicit newlines.';
document.getElementById('indeterminate').indeterminate=true;
</script></body></html>
