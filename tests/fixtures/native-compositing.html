<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Native compositing</title><style>
*{box-sizing:border-box}body{margin:0;padding:24px;background:#eaf0f8;font:18px/26px Arial;color:#243c62}
.case{position:relative;width:342px;height:236px;margin-bottom:24px;background:#fff;padding:28px;overflow:hidden}.stage{position:relative;width:286px;height:180px}
.group{position:absolute;left:20px;top:20px;width:190px;height:120px;background:#377eb6;border-radius:14px}.red{position:absolute;left:35px;top:20px;width:120px;height:80px;background:#e34562;border-radius:12px}.green{position:absolute;left:95px;top:60px;width:100px;height:70px;background:#26ad85;border-radius:8px}.group b{position:absolute;left:12px;top:12px;color:white}
#blur{filter:blur(4px)}#drop{filter:drop-shadow(9px 8px 4px #526b88);background:transparent}
#color{filter:brightness(.85) contrast(1.15) saturate(.6) hue-rotate(32deg) sepia(.2) grayscale(.2) opacity(.8) invert(.1)}
.clip{position:relative;width:220px;height:130px;overflow:hidden;border:4px solid #243c62;border-radius:18px}.clip #clipped{left:0;top:0;filter:blur(8px)}
#nested{opacity:.55;filter:blur(1px)}#nested .red{filter:brightness(.6)}
.back{position:absolute;left:0;top:0;width:240px;height:150px;background:repeating-linear-gradient(90deg,#2474b4 0px,#2474b4 14px,#e8c242 14px,#e8c242 28px)}
.blend{position:absolute;left:65px;top:35px;width:170px;height:100px;background:#dc416c;mix-blend-mode:multiply}.blend i{display:block;width:90px;height:70px;background:#35b98a}
.isolated{position:absolute;left:30px;top:20px;width:230px;height:145px;isolation:isolate}
.glass{position:absolute;left:35px;top:25px;width:185px;height:115px;border-radius:18px;background:#ffffff40;backdrop-filter:blur(5px) saturate(.4)}
#inset{position:absolute;left:15px;top:15px;width:230px;height:140px;background:#b7d8ef;border-radius:22px;border:5px solid #4876a0;box-shadow:inset 5px 7px 12px 3px #172d6280,inset -5px -3px 6px -2px #fff9,4px 4px 8px #44557755}
#inset b{position:absolute;left:40px;top:40px}#pseudo{position:relative;width:250px;height:160px;background:#e5d9b8}#pseudo::before{content:'Generated';position:absolute;left:20px;top:25px;width:180px;height:100px;background:#327caf;color:white;filter:drop-shadow(5px 5px 3px #25364b);box-shadow:inset 3px 3px 8px #0018}

#transformed{transform:rotate(12deg) scale(1.15,.65);filter:blur(4px)}
#perspective{transform:perspective(400px) rotateY(24deg) rotateX(9deg);filter:blur(3px) drop-shadow(6px 7px 2px #2348)}
#transformed-backdrop{transform:rotate(10deg) scale(.9,1.1)}
</style></head><body>
<section class="case" id="case-blur"><div class="stage"><div class="group" id="blur"><b>Native</b><div class="red"></div><div class="green"></div></div></div></section>
<section class="case" id="case-drop"><div class="stage"><div class="group" id="drop"><div class="red"></div><div class="green"></div></div></div></section>
<section class="case" id="case-color"><div class="stage"><div class="group" id="color"><div class="red"></div><div class="green"></div></div></div></section>
<section class="case" id="case-clipped"><div class="stage"><div class="clip"><div class="group" id="clipped"><div class="red"></div><div class="green"></div></div></div></div></section>
<section class="case" id="case-nested"><div class="stage"><div class="group" id="nested"><div class="red"></div><div class="green"></div></div></div></section>
<section class="case" id="case-blend"><div class="stage"><div class="back"></div><div class="blend" id="blend"><i></i></div></div></section>
<section class="case" id="case-isolation"><div class="stage"><div class="back"></div><div class="isolated"><div class="blend" id="isolate-blend"><i></i></div></div></div></section>
<section class="case" id="case-backdrop"><div class="stage"><div class="back"></div><div class="glass" id="backdrop"></div></div></section>
<section class="case" id="case-inset"><div class="stage"><div id="inset"><b>Inset</b></div></div></section>
<section class="case" id="case-pseudo"><div class="stage"><div id="pseudo"></div></div></section>
<section class="case" id="case-transformed"><div class="stage"><div class="group" id="transformed"><b>Native</b><div class="red"></div><div class="green"></div></div></div></section>
<section class="case" id="case-perspective"><div class="stage"><div class="group" id="perspective"><div class="red"></div><div class="green"></div></div></div></section>
<section class="case" id="case-transformed-backdrop"><div class="stage"><div class="back"></div><div class="glass" id="transformed-backdrop"></div></div></section>
</body></html>
