name: Publish npm package

on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: npm-publish-${{ github.ref }}
  cancel-in-progress: false

jobs:
  package:
    if: ${{ !github.event.deleted }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          package-manager-cache: false

      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
      - run: bun install --frozen-lockfile

      - name: Set package version from tag
        id: release
        shell: bash
        run: |
          if [[ ! "$GITHUB_REF_NAME" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]; then
            echo "::error::Use a release tag such as v1.2.3."
            exit 1
          fi

          version="${GITHUB_REF_NAME#v}"
          npm pkg set "version=$version" --workspace @quantacenter/page2design
          printf 'version=%s\n' "$version" >> "$GITHUB_OUTPUT"

      - name: Test core
        run: bun run --cwd packages/core test

      - name: Install Chromium for package verification
        run: bun run setup:browser --with-deps

      - name: Pack and verify the npm package
        run: bun run test:package

      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-package
          path: artifacts/package-extraction/quantacenter-page2design-${{ steps.release.outputs.version }}.tgz
          if-no-files-found: error
          overwrite: true

  publish:
    needs: package
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          registry-url: https://registry.npmjs.org/
          package-manager-cache: false

      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: npm-package
          path: npm-package

      - name: Publish to npm
        shell: bash
        run: npm publish "./npm-package/quantacenter-page2design-${GITHUB_REF_NAME#v}.tgz" --access public --ignore-scripts
